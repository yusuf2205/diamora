# PostgreSQL 17 tuned for a NAS (few GB RAM shared with other containers). Edit + `docker compose restart postgres`.
listen_addresses = '*'          # reachable ONLY on the internal Docker network `data` (never published)
max_connections = 60

shared_buffers = 384MB
effective_cache_size = 1GB
work_mem = 8MB
maintenance_work_mem = 96MB

random_page_cost = 2.0          # 1.1 on SSD
effective_io_concurrency = 2
checkpoint_completion_target = 0.9
wal_compression = on
max_wal_size = 2GB
min_wal_size = 256MB

# durability + point-in-time recovery (PITR): WAL segments are copied to the backup volume
wal_level = replica
fsync = on
synchronous_commit = on
archive_mode = on
archive_timeout = 300           # at most 5 minutes of WAL are ever unarchived (RPO)
archive_command = 'test ! -f /wal-archive/%f && cp %p /wal-archive/%f.tmp && mv /wal-archive/%f.tmp /wal-archive/%f'
max_wal_senders = 3

password_encryption = scram-sha-256
hba_file = '/etc/postgresql/pg_hba.conf'

timezone = 'UTC'
log_timezone = 'UTC'
log_min_duration_statement = 500
log_checkpoints = on
log_lock_waits = on
log_line_prefix = '%m [%p] %u@%d '
